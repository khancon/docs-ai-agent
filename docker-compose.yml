services:
  api:
    build: .
    ports:
      - '8000:8000'
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:4b}
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:0.12.7
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - ollama_models:/root/.ollama
volumes:
  ollama_models:
